<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Музыкальный Плеер</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e24">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121214;
            color: #ffffff;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .player-card {
            background-color: #1e1e24;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            text-align: center;
            width: 280px;
        }
        .cover {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #8a2387, #e94057, #f27121);
            margin: 0 auto 25px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            box-shadow: 0 8px 20px rgba(233, 64, 87, 0.3);
            transition: border-radius 0.3s ease;
        }
        /* Анимация вращения пластинки */
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        .playing .cover {
            border-radius: 50%; /* Делаем круглым */
            animation: spin 4s linear infinite;
        }
        
        h2 { margin: 10px 0 5px; font-size: 20px; font-weight: 600; }
        p { color: #a0a0aa; margin: 0 0 25px; font-size: 14px; }
        
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            background-color: #3f3f46;
            border: none;
            color: white;
            padding: 12px;
            font-size: 16px;
            border-radius: 50%;
            cursor: pointer;
            width: 45px;
            height: 45px;
            transition: 0.2s;
        }
        button:active { transform: scale(0.9); }
        button:hover { background-color: #52525b; }
        
        #playPauseBtn {
            background-color: #e94057;
            width: 60px;
            height: 60px;
            font-size: 20px;
        }
        #playPauseBtn:hover { background-color: #ff556f; }
        
        .progress-container {
            background-color: #3f3f46;
            border-radius: 10px;
            cursor: pointer;
            margin: 20px 0 10px;
            height: 6px;
            width: 100%;
        }
        .progress {
            background-color: #e94057;
            border-radius: 10px;
            height: 100%;
            width: 0%;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

    <div class="player-card" id="player">
        <div class="cover" id="coverEmoji">🎵</div>
        <h2 id="title">Загрузка...</h2>
        <p id="artist">Исполнитель</p>
        
        <audio id="audio" src=""></audio>
        
        <div class="progress-container" id="progress-container">
            <div class="progress" id="progress"></div>
        </div>

        <div class="controls">
            <button id="prevBtn">⏮</button>
            <button id="playPauseBtn">▶</button>
            <button id="nextBtn">⏭</button>
        </div>
    </div>

    <script>
        const audio = document.getElementById('audio');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progress = document.getElementById('progress');
        const progressContainer = document.getElementById('progress-container');
        const title = document.getElementById('title');
        const artist = document.getElementById('artist');
        const coverEmoji = document.getElementById('coverEmoji');
        const player = document.getElementById('player');

        // Наш плейлист
        const tracks = [
            { name: "трек 1", artist: "hy1", file: "track1.mp3", emoji: "🔥" },
            { name: "трек 2", artist: "s1rota", file: "track2.mp3", emoji: "💨" },
            { name: "трек 3", artist: "j0pa", file: "track3.mp3", emoji: "🎧" }
        ];

        let trackIndex = 0;
        let isPlaying = false;

        // Загрузка данных трека
        function loadTrack(track) {
            title.innerText = track.name;
            artist.innerText = track.artist;
            coverEmoji.innerText = track.emoji;
            audio.src = track.file;
        }

        // Играть трек
        function playTrack() {
            isPlaying = true;
            player.classList.add('playing');
            playPauseBtn.innerText = '⏸';
            audio.play();
        }

        // Пауза
        function pauseTrack() {
            isPlaying = false;
            player.classList.remove('playing');
            playPauseBtn.innerText = '▶';
            audio.pause();
        }

        // Кнопка Play/Pause
        playPauseBtn.addEventListener('click', () => {
            isPlaying ? pauseTrack() : playTrack();
        });

        // Следующий трек
        function nextTrack() {
            trackIndex = (trackIndex + 1) % tracks.length;
            loadTrack(tracks[trackIndex]);
            if (isPlaying) playTrack();
        }

        // Предыдущий трек
        function prevTrack() {
            trackIndex = (trackIndex - 1 + tracks.length) % tracks.length;
            loadTrack(tracks[trackIndex]);
            if (isPlaying) playTrack();
        }

        nextBtn.addEventListener('click', nextTrack);
        prevBtn.addEventListener('click', prevTrack);
        
        // Автопереключение, когда трек закончился
        audio.addEventListener('ended', nextTrack);

        // Полоса прогресса (обновление)
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const progressPercent = (audio.currentTime / audio.duration) * 100;
                progress.style.width = `${progressPercent}%`;
            }
        });

        // Перемотка
        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            if (audio.duration) {
                audio.currentTime = (clickX / width) * audio.duration;
            }
        });

        // Инициализация при запуске
        loadTrack(tracks[trackIndex]);

        // Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>
</html>
